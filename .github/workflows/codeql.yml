name: CodeQL

# Static security analysis of the GitHub Actions workflows themselves (script
# injection, over-broad permissions, untrusted checkouts); findings appear
# under Security > Code scanning. CodeQL has no Julia support, so the package
# is covered by its tests (including Aqua), JET and Verilator lint instead.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:actions
