name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on the same branch / PR
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # FST waveforms need zlib and lz4 headers, installed on Linux below
      VERIJUL_TEST_FST: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # 1.10 is the oldest Julia VeriJul supports (Project.toml [compat])
        julia-version: ['1.10', '1.11', '1']
        os: [ubuntu-latest]
        include:
          - julia-version: '1'
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y verilator g++ zlib1g-dev liblz4-dev

      - name: Install Verilator (macOS)
        if: runner.os == 'macOS'
        run: brew install verilator

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # Fail loudly on main (where the secret is available); forks can't see it
          fail_ci_if_error: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  benchmark:
    # Scheduler throughput, with a design written in Julia (no Verilator).
    # Reported in the job summary; it doesn't fail the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run the scheduler benchmark
        run: |
          julia --project benchmark/scheduler.jl | tee bench.txt
          { echo '### Scheduler benchmark'; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  verilog-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Lint Verilog sources
        run: |
          verilator --lint-only -Wno-WIDTHEXPAND examples/filter.v
          verilator --lint-only -Wall examples/gcd.v
          verilator --lint-only -Wall examples/fifo.v
          verilator --lint-only -Wall examples/uart_tx.v
          verilator --lint-only -Wall examples/stream_filter.v
          verilator --lint-only -Iexamples/counter/include \
            examples/counter/counter.v examples/counter/inverter.v --top-module counter
